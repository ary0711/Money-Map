<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/jpeg" href="money-map.jpg">
<title>Money Map — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --cream:#FBF2E7;
  --cream-2:#F2E4D4;
  --ink:#3B2A2C;
  --ink-soft:#83686B;
  --surface:#FFFEFC;
  --border:rgba(59,42,44,0.14);
  --shadow-soft:0 2px 14px rgba(59,42,44,.07);

  --rose:#E1A3A3;     --rose-ink:#8B4A4A;     --rose-tint:#F7E7E5;
  --sage:#9CBB9F;      --sage-ink:#3E6A49;     --sage-tint:#E7EFE4;
  --peach:#EDBC8B;     --peach-ink:#8A5A28;    --peach-tint:#FAEBDA;
  --lavender:#C1AED3;  --lavender-ink:#69497F; --lavender-tint:#EFE7F5;
  --gold:#D2B269;      --gold-ink:#7C5E22;     --gold-tint:#F4EAD3;
  --danger:#C5766B;    --danger-ink:#833C33;   --danger-tint:#F5E1DD;

  --radius-card:22px 6px 22px 6px;
  --radius-card-sm:16px 5px 16px 5px;
  --radius-pill:999px;
  --radius-input:10px;

  --font-display:'Fraunces',serif;
  --font-body:'Figtree',sans-serif;

  --sidebar-bg:var(--surface);
  --sidebar-text:var(--ink);
  --sidebar-text-dim:var(--ink-soft);
  --sidebar-hover:color-mix(in srgb, var(--ink) 8%, transparent);
  --sidebar-active:color-mix(in srgb, var(--ink) 14%, transparent);

  --bg-gradient: radial-gradient(ellipse 90% 60% at 12% -8%, #F6D9D6 0%, transparent 55%),
                 radial-gradient(ellipse 80% 55% at 100% 0%, #F6E0C2 0%, transparent 60%),
                 radial-gradient(ellipse 70% 50% at 100% 100%, #E4D6EE 0%, transparent 55%),
                 var(--cream);
}
/* Dark theme — opt-in only, switched from Settings. Never auto-applied
   from the OS/browser preference, so it can't surprise anyone. */
:root[data-theme="dark"]{
  --cream:#241A1C; --cream-2:#2D2225; --ink:#F2E4DA; --ink-soft:#C4A6A6;
  --surface:#2D2225; --border:rgba(255,255,255,.12); --shadow-soft:0 2px 14px rgba(0,0,0,.35);
  --rose:#E7B4B4; --rose-ink:#F0CFCF; --rose-tint:#3A2A2C;
  --sage:#A8C6AB; --sage-ink:#CFE4D1; --sage-tint:#283229;
  --peach:#F0C89A; --peach-ink:#F6DDB9; --peach-tint:#332820;
  --lavender:#CCBADD; --lavender-ink:#E4D6EE; --lavender-tint:#2B2431;
  --gold:#DDC07D; --gold-ink:#EFDDB0; --gold-tint:#322A1B;
  --danger:#D08A80; --danger-ink:#F0C6C0; --danger-tint:#322322;
  --bg-gradient: var(--cream);
}


*,*::before,*::after{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth;}
body{
  margin:0; background:var(--bg-gradient, var(--cream)); background-attachment:fixed; color:var(--ink); font-family:var(--font-body);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased; min-height:100%;
  transition:background .25s ease, color .25s ease;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0; line-height:1.12; letter-spacing:-.01em;}
p{margin:0;}
a{color:inherit;}
button{font-family:var(--font-body);}
img,svg{display:block;}
.container{max-width:1180px; margin:0 auto; padding:0 28px;}
.visually-hidden{position:absolute; width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
:focus-visible{outline:2px solid var(--lavender-ink); outline-offset:2px;}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* ============ BUTTONS / FORM ELEMENTS ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 22px; border-radius:var(--radius-pill); border:1px solid transparent;
  font-family:var(--font-body); font-weight:600; font-size:15px; cursor:pointer;
  text-decoration:none; transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  line-height:1;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink); color:var(--cream);}
.btn-primary:hover{box-shadow:0 6px 18px rgba(59,42,44,.22);}
.btn-outline{background:transparent; color:var(--ink); border-color:var(--border);}
.btn-outline:hover{background:var(--surface);}
.btn-ghost{background:transparent; color:var(--ink-soft); padding:10px 14px;}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:8px 16px; font-size:13.5px;}
.btn-danger{background:transparent; color:var(--danger-ink); border-color:var(--danger);}
.btn-danger:hover{background:var(--danger-tint);}
.btn[disabled]{opacity:.5; cursor:not-allowed;}
.btn svg{width:16px; height:16px;}

label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
input,select{
  width:100%; padding:11px 13px; border-radius:var(--radius-input); border:1px solid var(--border);
  background:var(--surface); color:var(--ink); font-family:var(--font-body); font-size:14.5px;
}
input:focus,select:focus{outline:2px solid var(--lavender-ink); outline-offset:1px;}
.field{margin-bottom:16px;}
.password-field{position:relative;}
.password-field input{padding-right:44px;}
.password-toggle{position:absolute; top:50%; right:5px; transform:translateY(-50%); background:transparent; border:none; cursor:pointer; color:var(--ink-soft); padding:8px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.password-toggle:hover{color:var(--ink); background:var(--cream-2);}
.password-toggle svg{width:17px; height:17px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:520px){ .field-row{grid-template-columns:1fr;} }
.help-text{font-size:12.5px; color:var(--ink-soft); margin-top:6px;}
.error-text{font-size:13px; color:var(--danger-ink); margin-top:10px; display:none;}
.error-text.show{display:block;}
.field.invalid label{color:var(--danger-ink);}
.field.invalid input{border-color:var(--danger); background:var(--danger-tint);}
.field.invalid input:focus{outline-color:var(--danger-ink);}

/* ============ TOP NAV (public) ============ */
.pubnav{position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--cream) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
.pubnav-inner{display:flex; align-items:center; justify-content:space-between; padding:18px 0;}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:600; font-size:19px; text-decoration:none; color:var(--ink);}
.brand-mark{width:30px; height:30px; flex-shrink:0; border-radius:50%; background:var(--cream); box-sizing:border-box; padding:3px; overflow:hidden; display:flex; align-items:center; justify-content:center;}
.brand-mark img{width:100%; height:100%; object-fit:contain; display:block;}
.pubnav-links{display:flex; align-items:center; gap:28px; font-size:14.5px; font-weight:500;}
.pubnav-links a{text-decoration:none; color:var(--ink-soft);}
.pubnav-links a:hover{color:var(--ink);}
.pubnav-actions{display:flex; align-items:center; gap:10px;}
.icon-btn{width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);}
.icon-btn:hover{color:var(--ink);}
.icon-btn svg{width:17px; height:17px;}
@media (max-width:760px){ .pubnav-links{display:none;} }

/* ============ HERO ============ */
.hero{padding:64px 0 40px;}
.hero-grid{display:grid; grid-template-columns:1.05fr .95fr; gap:56px; align-items:center;}
@media (max-width:900px){ .hero-grid{grid-template-columns:1fr; gap:36px;} }
.eyebrow-line{display:flex; align-items:center; gap:10px; margin-bottom:18px; color:var(--ink-soft); font-size:14px;}
.eyebrow-line .dot-row{display:flex; gap:5px;}
.eyebrow-line .dot{width:7px; height:7px; border-radius:50%;}
h1.hero-head{font-size:clamp(34px,4.6vw,54px); font-weight:600;}
h1.hero-head em{font-style:italic; font-weight:400; color:var(--rose-ink);}
.hero-sub{margin-top:20px; font-size:17.5px; line-height:1.6; color:var(--ink-soft); max-width:46ch;}
.hero-ctas{display:flex; gap:14px; margin-top:30px; flex-wrap:wrap;}
.hero-note{margin-top:22px; font-size:13.5px; color:var(--ink-soft); display:flex; align-items:center; gap:8px;}

/* constellation graphic */
.constellation{position:relative; width:100%; aspect-ratio:1/.92;}
.constellation svg{width:100%; height:100%;}

/* ============ PILLAR STRIP ============ */
.section{padding:64px 0;}
.section-head{max-width:640px; margin-bottom:40px;}
.section-tag{font-size:13.5px; font-weight:700; color:var(--ink-soft); margin-bottom:10px;}
.section-title{font-size:clamp(26px,3vw,36px);}
.pillar-list{display:flex; flex-direction:column; border-top:1px solid var(--border);}
.pillar-row{display:grid; grid-template-columns:60px 200px 1fr 140px; gap:22px; align-items:center; padding:26px 0; border-bottom:1px solid var(--border);}
@media (max-width:760px){ .pillar-row{grid-template-columns:40px 1fr; grid-template-areas:"num name" ". desc" ". cat"; row-gap:8px;} .pillar-row .p-num{grid-area:num;} .pillar-row .p-name{grid-area:name;} .pillar-row .p-desc{grid-area:desc;} .pillar-row .p-cat{grid-area:cat;} }
.p-num{font-family:var(--font-display); font-size:26px; color:var(--ink-soft); opacity:.5;}
.p-name{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-size:20px; font-weight:600;}
.p-swatch{width:13px; height:13px; border-radius:50%; flex-shrink:0;}
.p-desc{color:var(--ink-soft); font-size:15px; line-height:1.55;}
.p-cat{font-size:12.5px; color:var(--ink-soft); text-align:right;}
@media (max-width:760px){ .p-cat{text-align:left;} }

/* ============ HOW IT WORKS ============ */
.steps{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
@media (max-width:820px){ .steps{grid-template-columns:1fr;} }
.step-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:28px; box-shadow:var(--shadow-soft);}
.step-num{font-family:var(--font-display); font-size:30px; color:var(--lavender-ink); margin-bottom:14px;}
.step-card h3{font-size:19px; margin-bottom:10px;}
.step-card p{color:var(--ink-soft); font-size:14.5px; line-height:1.6;}

/* ============ CTA band ============ */
.cta-band{background:var(--ink); color:var(--cream); border-radius:var(--radius-card); padding:52px 44px; display:flex; align-items:center; justify-content:space-between; gap:28px; flex-wrap:wrap;}

.cta-band h2{font-size:clamp(22px,2.6vw,30px); max-width:26ch;}
.cta-band .btn-primary{background:var(--cream); color:var(--ink);}
:root[data-theme="dark"] .cta-band{background:var(--surface); border:1px solid var(--border); color:var(--ink);}
:root[data-theme="dark"] .cta-band .btn-primary{background:var(--ink); color:var(--cream);}

/* ============ FOOTER ============ */
footer{border-top:1px solid var(--border); padding:34px 0; margin-top:20px;}
.footer-inner{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; font-size:13px; color:var(--ink-soft);}

/* ============ AUTH SPLIT PAGES ============ */
.auth-wrap{min-height:100vh; min-height:100dvh; display:grid; grid-template-columns:.85fr 1fr;}
@media (max-width:860px){ .auth-wrap{grid-template-columns:1fr;} .auth-visual{display:none;} }
.auth-visual{background:linear-gradient(155deg, var(--rose-tint), var(--lavender-tint) 55%, var(--peach-tint)); padding:52px; display:flex; flex-direction:column; justify-content:space-between;}
.auth-visual blockquote{font-family:var(--font-display); font-size:26px; line-height:1.4; max-width:26ch; font-style:italic; color:var(--ink);}
.auth-form-side{display:flex; align-items:center; justify-content:center; padding:40px 24px;}
.auth-card{width:100%; max-width:400px;}
.auth-card .brand{margin-bottom:36px;}
.auth-card h1{font-size:28px; margin-bottom:8px;}
.auth-card .sub{color:var(--ink-soft); font-size:14.5px; margin-bottom:28px;}
.auth-switch{margin-top:22px; font-size:14px; color:var(--ink-soft); text-align:center;}
.auth-switch a{font-weight:600; color:var(--ink); text-decoration:underline;}

/* ============ APP SHELL ============ */
.shell{display:grid; grid-template-columns:250px 1fr; min-height:100vh; min-height:100dvh;}
@media (max-width:900px){ .shell{grid-template-columns:1fr;} }
.sidebar{
  background:var(--sidebar-bg); color:var(--sidebar-text); padding:26px 18px; display:flex; flex-direction:column;
  padding-top:calc(26px + env(safe-area-inset-top,0px));
  border-right:1px solid var(--border);
  transition:background .25s ease, border-color .25s ease;
}

/* Static sidebar: pinned to the viewport and scrolls independently,
   so it never travels away with the page content on desktop. */
@media (min-width:901px){
  .sidebar{
    position:sticky; top:0; align-self:start;
    height:100vh; height:100dvh;
    overflow-y:auto; scrollbar-width:thin;
  }
}

@media (max-width:900px){
  .sidebar{position:fixed; inset:0 22% 0 0; z-index:60; transform:translateX(-105%); transition:transform .25s ease; box-shadow:0 0 40px rgba(0,0,0,.3);}
  .sidebar.open{transform:translateX(0);}
}
.side-brand-row{display:flex; align-items:center; justify-content:space-between;}
.side-close{display:none; background:none; border:none; color:var(--sidebar-text-dim); cursor:pointer; padding:6px;}
.side-close svg{width:18px; height:18px;}
@media (max-width:900px){ .side-close{display:block;} }
.side-brand{display:flex; align-items:center; gap:10px; padding:4px 10px 26px; font-family:var(--font-display); font-size:18px; font-weight:600; color:var(--sidebar-text);}
.side-brand .brand-mark{width:26px; height:26px;}
.side-org{padding:0 10px 18px; font-size:12.5px; color:var(--sidebar-text-dim); border-bottom:1px solid var(--border); margin-bottom:14px; overflow-wrap:anywhere;}
.side-org strong{display:block; color:var(--sidebar-text); font-size:14px; margin-bottom:2px;}
.side-nav{display:flex; flex-direction:column; gap:3px; flex:1;}
.side-link{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:var(--radius-pill); text-decoration:none; color:var(--sidebar-text-dim); font-size:14.5px; font-weight:500; transition:background .15s ease; background:transparent; border:none; font-family:var(--font-body); cursor:pointer;}
.side-link svg{width:17px; height:17px; flex-shrink:0;}
.side-link .dot{width:8px; height:8px; border-radius:50%; margin-left:auto; flex-shrink:0;}
.side-link:hover{background:var(--sidebar-hover); color:var(--sidebar-text);}
.side-link.active{background:var(--sidebar-active); color:var(--sidebar-text);}
.side-foot{border-top:1px solid var(--border); padding-top:14px; margin-top:14px; display:flex; flex-direction:column; gap:3px;}
.side-foot .side-link{color:var(--sidebar-text-dim);}
.side-theme-toggle{display:flex; gap:4px; background:var(--cream-2); border-radius:var(--radius-pill); padding:4px; margin-bottom:10px;}
.side-theme-opt{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:8px 0; border-radius:var(--radius-pill); border:none; background:transparent; color:var(--sidebar-text-dim); font-size:12.5px; font-weight:600; font-family:var(--font-body); cursor:pointer;}
.side-theme-opt svg{width:14px; height:14px;}
.side-theme-opt.active{background:var(--sidebar-active); color:var(--sidebar-text);}

.main-col{min-width:0;}
.topbar{
  position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--cream) 90%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border); padding:16px 28px; padding-top:calc(16px + env(safe-area-inset-top,0px));
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.topbar-left{display:flex; align-items:center; gap:12px;}
.topbar h2{font-size:19px;}
.topbar-sub{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
.hamburger{display:none; width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface); align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
.hamburger svg{width:18px; height:18px;}
@media (max-width:900px){ .hamburger{display:flex;} }
.topbar-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:50;}
.scrim.show{display:block;}

.view{padding:28px; max-width:1180px;}
.view-head{display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap; margin-bottom:26px;}
.view-head h1{font-size:clamp(24px,3vw,32px);}
.view-head .desc{color:var(--ink-soft); font-size:14.5px; margin-top:6px; max-width:56ch;}
.year-select{width:auto; padding:9px 14px;}

/* ============ CARDS / GRID ============ */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:22px; box-shadow:var(--shadow-soft); transition:box-shadow .2s ease, transform .2s ease;}
.card:hover{box-shadow:0 10px 28px rgba(59,42,44,.11); transform:translateY(-1px);}
.card-head{display:flex; align-items:center; gap:11px; margin-bottom:16px;}
.card-head .ci{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.card-head .ci svg{width:15px; height:15px;}
.card-head h3{margin-bottom:0;}

.dash-greeting{font-size:13.5px; color:var(--ink-soft); font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:8px;}
.pillar-rail{display:inline-flex; gap:3px;}
.rail-dot{width:6px; height:6px; border-radius:50%; display:inline-block;}

.grid-kfi{display:grid; grid-template-columns:repeat(5,1fr); gap:16px; margin-bottom:16px;}
@media (max-width:1180px){ .grid-kfi{grid-template-columns:repeat(3,1fr);} }
@media (max-width:640px){ .grid-kfi{grid-template-columns:repeat(2,1fr);} }
.kfi.clickable,.insight-card.clickable,.goal-row-link{cursor:pointer;}
.kfi.clickable:focus-visible,.insight-card.clickable:focus-visible{outline:2px solid var(--lavender-ink); outline-offset:2px;}
.kfi{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card-sm); padding:18px 18px; position:relative; overflow:hidden; transition:box-shadow .2s ease, transform .2s ease;}
.kfi::before{content:""; position:absolute; top:0; left:0; right:0; height:4px; background:var(--bar,var(--rose));}
.kfi:hover{box-shadow:0 10px 24px rgba(59,42,44,.12); transform:translateY(-2px);}
.kfi-icon{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:12px;}
.kfi-icon svg{width:15px; height:15px;}
.kfi .k-label{font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-bottom:6px;}
.kfi .k-value{font-family:var(--font-display); font-size:23px; font-weight:600;}
.kfi .k-sub{font-size:12px; color:var(--ink-soft); margin-top:4px;}

.grid-insights{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px;}
@media (max-width:760px){ .grid-insights{grid-template-columns:1fr;} }
.insight-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card-sm); padding:20px 22px; box-shadow:var(--shadow-soft); display:flex; flex-direction:column; gap:6px;}
.insight-card .k-label{font-size:12.5px; color:var(--ink-soft); font-weight:600;}
.insight-card .k-value{font-family:var(--font-display); font-size:26px; font-weight:600;}
.insight-card .k-sub{font-size:12px; color:var(--ink-soft);}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px;}
@media (max-width:900px){ .grid-2{grid-template-columns:1fr;} }
.card h3{font-size:16.5px; margin-bottom:16px;}
.chart-box{position:relative; height:250px;}
.chart-box.tall{height:290px;}

.empty-state{text-align:center; padding:34px 20px; color:var(--ink-soft);}
.empty-state svg{width:34px; height:34px; margin:0 auto 12px; opacity:.5;}
.empty-state p{font-size:14px; max-width:36ch; margin:0 auto;}

/* ============ TABLES ============ */
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-card-sm);}
table{width:100%; border-collapse:collapse; font-size:14px; min-width:560px;}
thead th{text-align:left; font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:none; padding:12px 14px; background:var(--cream-2); border-bottom:1px solid var(--border); white-space:nowrap;}
tbody td{padding:11px 14px; border-bottom:1px solid var(--border); white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tfoot td{padding:12px 14px; font-weight:700; border-top:2px solid var(--border);}
.num{text-align:right; font-variant-numeric:tabular-nums;}
.pos{color:var(--sage-ink); font-weight:600;}
.neg{color:var(--danger-ink); font-weight:600;}
.muted{color:var(--ink-soft);}
.row-del{background:transparent; border:none; cursor:pointer; color:var(--ink-soft); padding:6px; border-radius:50%;}
.row-del:hover{color:var(--danger-ink); background:var(--danger-tint);}
.row-del svg{width:15px; height:15px;}
.row-edit{background:transparent; border:none; cursor:pointer; color:var(--ink-soft); padding:6px; border-radius:50%;}
.row-edit:hover{color:var(--lavender-ink); background:var(--lavender-tint);}
.row-edit svg{width:15px; height:15px;}
.stat-chips{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
@media (max-width:760px){ .stat-chips{grid-template-columns:repeat(2,1fr);} }
.stat-chip{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card-sm); padding:15px 17px;}
.stat-chip .sc-label{font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:6px;}
.stat-chip .sc-value{font-family:var(--font-display); font-size:19px; font-weight:600;}
.theme-switch{display:inline-flex; gap:6px; background:var(--cream-2); border-radius:var(--radius-pill); padding:5px;}
.theme-opt{display:inline-flex; align-items:center; gap:7px; padding:9px 18px; border-radius:var(--radius-pill); border:none; background:transparent; color:var(--ink-soft); font-weight:600; font-size:14px; cursor:pointer; font-family:var(--font-body);}
.theme-opt.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-soft);}
.edit-banner{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--lavender-tint); color:var(--lavender-ink); border-radius:var(--radius-input); padding:9px 14px; font-size:13px; font-weight:600; margin-bottom:14px;}
.inline-ico{display:inline-flex; width:15px; height:15px; vertical-align:-2px;}
.inline-ico svg{width:100%; height:100%;}

/* pill badge */
.badge{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:var(--radius-pill); font-size:12px; font-weight:700;}
.badge.b-good{background:var(--sage-tint); color:var(--sage-ink);}
.badge.b-warn{background:var(--peach-tint); color:var(--peach-ink);}
.badge.b-bad{background:var(--danger-tint); color:var(--danger-ink);}

/* ============ FORM CARD ============ */
.form-card{margin-bottom:20px;}
.form-card .form-grid{display:grid; grid-template-columns:1.1fr 1.1fr 1.6fr 1fr auto; gap:14px; align-items:end;}
@media (max-width:980px){ .form-card .form-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:560px){ .form-card .form-grid{grid-template-columns:1fr;} }
.form-card .field{margin-bottom:0;}

/* goal card */
.goal-card{border:1px solid var(--border); border-radius:var(--radius-card-sm); padding:20px; background:var(--surface); margin-bottom:14px;}
.goal-top{display:flex; justify-content:space-between; gap:14px; align-items:flex-start; margin-bottom:12px;}
.goal-name{font-family:var(--font-display); font-size:18px; font-weight:600;}
.goal-cat{font-size:12.5px; color:var(--ink-soft);}
.progress-track{height:9px; border-radius:var(--radius-pill); background:var(--cream-2); overflow:hidden; margin:12px 0 10px;}
.progress-fill{height:100%; border-radius:var(--radius-pill);}
.goal-meta{display:flex; justify-content:space-between; font-size:13px; color:var(--ink-soft); margin-bottom:14px; flex-wrap:wrap; gap:6px;}
.goal-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.goal-actions input{width:130px;}

/* budget table inline input */
.budget-input{width:110px; padding:7px 10px;}

/* landing page in-app link */
.brand-mark svg{width:100%; height:100%;}

/* ============ MONEY MOOD + RECEIPT (transaction form) ============ */
.tx-extra-row{display:flex; gap:22px; flex-wrap:wrap; margin-top:16px; padding-top:16px; border-top:1px dashed var(--border);}
.mood-field, .receipt-field{flex:1; min-width:240px;}
.mood-picker{display:flex; gap:8px; flex-wrap:wrap;}
.mood-btn{width:42px; height:42px; border-radius:50%; border:1px solid var(--border); background:var(--surface); font-size:19px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .15s ease, border-color .15s ease, background .15s ease;}
.mood-btn:hover{transform:translateY(-2px);}
.mood-btn.active{border-color:var(--lavender-ink); background:var(--lavender-tint); transform:translateY(-2px); box-shadow:0 2px 8px rgba(0,0,0,.08);}
.desc-row{display:flex; gap:8px; align-items:flex-end;}
.desc-row .field{flex:1; margin-bottom:0;}
.btn-voice{white-space:nowrap; flex-shrink:0;}
.receipt-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.receipt-file-label{display:inline-flex; align-items:center; gap:7px; padding:10px 15px; border-radius:var(--radius-input); border:1px solid var(--border); background:var(--surface); cursor:pointer; font-size:13.5px; font-weight:600; color:var(--ink);}
.receipt-file-label:hover{background:var(--cream-2);}
.receipt-file-label input{display:none;}
.receipt-preview{display:flex; align-items:center; gap:8px;}
.receipt-preview img{width:46px; height:46px; object-fit:cover; border-radius:8px; border:1px solid var(--border); cursor:zoom-in;}
.receipt-remove{width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;}
.receipt-remove svg{width:13px; height:13px;}
.receipt-remove:hover{color:var(--danger-ink); border-color:var(--danger);}
.receipt-thumb-btn{background:transparent; border:none; cursor:pointer; font-size:15px; line-height:1; padding:6px; border-radius:8px; color:var(--ink-soft);}
.receipt-thumb-btn:hover{background:var(--cream-2); color:var(--ink);}
.mood-tag{font-size:14px; margin-left:4px;}

/* ============ CROSS-PILLAR LINK TAG + TOAST ============ */
.link-tag{display:inline-block; margin-left:6px; padding:2px 8px; border-radius:var(--radius-pill); font-size:11px; font-weight:700; background:var(--lavender-tint); color:var(--lavender-ink); white-space:nowrap;}
.toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:220; background:var(--ink); color:var(--surface); padding:12px 20px; border-radius:var(--radius-pill); font-size:13.5px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.25); animation:celebrate-fade .2s ease; transition:opacity .3s ease;}
.toast.hide{opacity:0;}

/* ============ NUDGE BANNER ============ */
.nudge-banner{display:flex; align-items:flex-start; gap:12px; background:var(--peach-tint); border:1px solid var(--peach); border-radius:var(--radius-card-sm); padding:14px 16px; margin-bottom:20px;}
.nudge-emoji{font-size:20px; line-height:1.3;}
.nudge-text{flex:1; font-size:13.5px; color:var(--peach-ink); line-height:1.5;}
.nudge-close{flex-shrink:0; width:26px; height:26px; border-radius:50%; border:none; background:transparent; color:var(--peach-ink); cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:.7;}
.nudge-close:hover{opacity:1;}
.nudge-close svg{width:12px; height:12px;}

/* ============ GOAL BADGE ============ */
.badge-mini{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:var(--radius-pill); font-size:11.5px; font-weight:700; background:var(--sage-tint); color:var(--sage-ink);}

/* ============ MONEY MOOD JOURNAL (spending insights) ============ */
.mood-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px;}
.mood-stat{border:1px solid var(--border); border-radius:var(--radius-card-sm); padding:14px 10px; text-align:center; background:var(--surface);}
.mood-emoji-big{font-size:26px; margin-bottom:4px;}
.mood-label{font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-bottom:6px;}
.mood-amount{font-family:var(--font-display); font-size:16px; font-weight:600;}
.mood-count{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

/* ============ GOAL CELEBRATION MODAL ============ */
.celebrate-overlay{position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:24px; overflow:hidden; animation:celebrate-fade .2s ease;}
@keyframes celebrate-fade{from{opacity:0;} to{opacity:1;}}
.celebrate-card{position:relative; z-index:2; background:var(--surface); border-radius:var(--radius-card); padding:36px 32px; max-width:380px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.3); animation:celebrate-pop .35s cubic-bezier(.2,1.4,.4,1);}
@keyframes celebrate-pop{from{transform:scale(.85); opacity:0;} to{transform:scale(1); opacity:1;}}
.celebrate-emoji{font-size:44px; margin-bottom:6px;}
.celebrate-card h2{font-family:var(--font-display); font-size:22px; margin-bottom:10px;}
.celebrate-card p{color:var(--ink-soft); font-size:14.5px; line-height:1.55; margin-bottom:22px;}
.confetti-field{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
.confetti-piece{position:absolute; top:-12px; width:9px; height:14px; opacity:.9; border-radius:2px; animation-name:confetti-fall; animation-timing-function:linear; animation-fill-mode:forwards;}
@keyframes confetti-fall{to{transform:translateY(110vh) rotate(340deg); opacity:.4;}}

/* ============ RECEIPT LIGHTBOX ============ */
.lightbox-overlay{position:fixed; inset:0; z-index:210; background:rgba(0,0,0,.75); display:flex; align-items:center; justify-content:center; padding:30px;}
.lightbox-overlay img{max-width:100%; max-height:85vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.5);}
.lightbox-close{position:absolute; top:22px; right:22px; width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.15); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.lightbox-close svg{width:16px; height:16px;}
.lightbox-close:hover{background:rgba(255,255,255,.28);}

@media print{ .sidebar,.topbar,.pubnav,footer{display:none;} }

/* ============ MOBILE RESPONSIVE OVERRIDES ============ */
@media (max-width:900px){
  .shell{display:block; min-height:100dvh;}
  .main-col{width:100%; min-width:0;}
  .sidebar{
    width:min(320px,86vw);
    max-width:86vw;
    inset:0 auto 0 0;
    padding:20px 16px;
    padding-top:calc(20px + env(safe-area-inset-top,0px));

  .topbar-sub{font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:42vw;}
  .topbar-right{gap:7px;}
  .topbar-right .year-select{max-width:118px; padding:8px 9px; font-size:12px;}
  .icon-btn,.hamburger{width:36px; height:36px;}
  .view{padding:20px 16px 28px;}
  .view-head{align-items:flex-start; margin-bottom:20px; gap:12px;}
  .view-head h1{font-size:clamp(22px,7vw,30px);}
  .view-head .desc{font-size:13px; line-height:1.5;}
  .view-head > div:last-child{width:100%;}
  .view-head > div:last-child .btn{width:100%;}
  .grid-kfi{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
  .kfi{padding:15px 13px;}
  .kfi .k-value{font-size:19px; overflow-wrap:anywhere;}
  .kfi-icon{width:29px; height:29px; margin-bottom:9px;}
  .grid-insights{gap:10px; margin-bottom:18px;}
  .insight-card{padding:16px;}
  .insight-card .k-value{font-size:23px; overflow-wrap:anywhere;}
  .grid-2{gap:12px; margin-bottom:12px;}
  .card{padding:17px; border-radius:18px 5px 18px 5px;}
  .chart-box{height:220px;}

  .form-card .form-grid{gap:11px;}

  .goal-top{flex-direction:column; gap:10px;}

  .theme-switch{width:100%;}
  .theme-opt{flex:1; padding:9px 10px;}

@media (max-width:560px){

  .kfi .k-label{font-size:11.5px;}

  .card{padding:14px;}
}

  income:     ["Salary","Freelance","Bonus","Interest","Dividends","Gift","Other Income"],
  savings:    ["Emergency Fund","Short-Term Goal","Retirement Savings","Sinking Fund","Other Savings"],
  spending:   ["Housing","Groceries","Transportation","Utilities","Dining Out","Entertainment","Subscriptions","Other Expense"],
  investment: ["Stocks","Bonds","Index Fund","Retirement Account","Real Estate","Crypto","Other Investment"],
  protection: ["Health Insurance","Life Insurance","Auto Insurance","Home/Renters Insurance","Disability Insurance","Warranty/Extended Coverage","Other Protection"],
  goals:      ["Savings","Investment","Protection"]
};

/* Money Mood Journal — how a purchase felt, tagged at the moment it's logged */
const MOODS = [
  { key:'happy',    emoji:'😊', label:'Happy' },
  { key:'content',  emoji:'😌', label:'Content' },
  { key:'neutral',  emoji:'😐', label:'Neutral' },
  { key:'stressed', emoji:'😰', label:'Stressed' },
  { key:'guilty',   emoji:'😔', label:'Guilty' },
  { key:'excited',  emoji:'🤩', label:'Excited' },
];
function moodInfo(key){ return MOODS.find(m=>m.key===key) || null; }
function moodBreakdown(tx){
  const map = {};
  tx.forEach(e=>{
    if(!e.mood) return;
    if(!map[e.mood]) map[e.mood] = { total:0, count:0 };
    map[e.mood].total += Number(e.amount||0);
    map[e.mood].count += 1;
  });
  return map;
}
/* Mindful-spending streak: days since the last purchase tagged stressed/guilty */
function daysBetween(dateA, dateB){
  const a = new Date(dateA+'T00:00:00');
  const b = new Date(dateB+'T00:00:00');
  return Math.round((b-a)/(1000*60*60*24));
}
function mindfulStreakDays(allTx){
  const negDates = allTx.filter(e=> e.mood==='stressed' || e.mood==='guilty').map(e=>e.date).filter(Boolean).sort();
  if(!negDates.length) return null; // never logged a stressed/guilty purchase — nothing to reset yet
  return Math.max(0, daysBetween(negDates[negDates.length-1], todayISO()));
}
/* Gentle nudge: repeated stressed/guilty purchases in the current calendar month */
function negativeMoodThisMonth(allTx){
  const mk = todayISO().slice(0,7);
  const rows = allTx.filter(e=> (e.mood==='stressed'||e.mood==='guilty') && (e.date||'').slice(0,7)===mk);
  return { count: rows.length, total: rows.reduce((s,e)=>s+Number(e.amount||0),0) };
}

/* Wires up any .password-toggle buttons on the page (login / register).
   Each button needs data-target="<id of the password input>". */
function wirePasswordToggles(){
  document.querySelectorAll('.password-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const input = document.getElementById(btn.dataset.target);
      if(!input) return;
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.innerHTML = showing ? ICONS.eye : ICONS.eyeOff;
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });
  });
}

/* ---------- generic helpers ---------- */
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function money(n){
  n = Number(n)||0;
  return '₱' + n.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function moneyShort(n){
  n = Number(n)||0;
  return '₱' + n.toLocaleString('en-PH',{maximumFractionDigits:0});
}
function pct(x, digits){
  if(x===null || x===undefined || !isFinite(x)) return '–';
  return (x>=0?'+':'') + (x*100).toFixed(digits==null?1:digits) + '%';
}
function firstName(n){ return (n||'').trim().split(/\s+/)[0] || ''; }

/* ---------- auth / storage ---------- */
async function hashPass(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function getUsers(){ try{ return JSON.parse(localStorage.getItem(LS_USERS)) || {}; }catch(e){ return {}; } }

/* Returns {email,name,orgName} for a valid, logged-in session, else null.

function currentUser(){

<script>
/* =========================================================
   PISOFLOW — DASHBOARD APP
   This file only renders the authenticated app (this page,
   index.html). Storage keys, the data model, icons, and
   formatting helpers live in shared.js, loaded before this file.
   The landing page, login, and register are their own static
   HTML files (landing.html / login.html / register.html) with
   their own small scripts.
   ========================================================= */

/* ---------- state ---------- */
const state = { user:null, data:null, yearFilter:'all', sidebarOpen:false, editing:null, categoryFilter:{} };
let chartRegistry = {};

/* ---------- helpers ---------- */
const $ = sel => document.querySelector(sel);
const root = () => document.getElementById('root');
function saveData(){ if(state.user) persistData(state.user.email, state.data); }

/* =========================================================
   CROSS-PILLAR LINKS
   Goal contribution -> matching pillar (Savings / Investment / Protection).
   Spending is only for actual day-to-day expenses.
   ========================================================= */
const SPENDING_LINKS = {};
const GOAL_TO_PILLAR = {
  'Savings':    { pillar:'savings',    category:'Short-Term Goal' },
  'Investment': { pillar:'investment', category:'Other Investment' },
  'Protection': { pillar:'protection', category:'Other Protection' },
};
/* Goal contributions are reflected only in their matching pillar — never in Spending. */
function syncGoalContributionToPillar(g, contribution){
  if(!g || !contribution) return null;
  const rule = GOAL_TO_PILLAR[g.category];
  if(!rule) return null;
  const pillar = state.data[rule.pillar] || (state.data[rule.pillar]=[]);
  const contributionId = contribution.id || contribution.sourceId || uid();
  contribution.id = contributionId;
  const existing = pillar.find(e=>e.linkedGoalId===g.id && e.linkedGoalContributionId===contributionId);
  if(existing){
    existing.date = contribution.date || existing.date;
    existing.amount = Number(contribution.amount||0);
    existing.description = contribution.description || ('Goal: '+g.name);
    existing.category = rule.category;
    return existing;
  }
  const entry = {
    id:uid(),
    date:contribution.date || todayISO(),
    category:rule.category,
    description:contribution.description || ('Goal: '+g.name),
    amount:Number(contribution.amount||0),
    linkedGoalId:g.id,
    linkedGoalContributionId:contributionId
  };
  pillar.push(entry);
  return entry;
}
function syncAllGoalContributions(){
  state.data.goals.forEach(g=>{
    if(!Array.isArray(g.contributions)) return;
    g.contributions.forEach(c=>syncGoalContributionToPillar(g,c));
  });
}
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.classList.add('hide'); setTimeout(()=>t.remove(), 300); }, 3200);
}
/* Savings 'Emergency Fund' entries -> matching goal (name contains "emergency") */
function unsyncEntryGoal(entry){
  if(!entry || !entry.goalSyncId) return;
  const g = state.data.goals.find(x=>x.id===entry.goalSyncId);
  if(g) g.currentAmount = Math.max(0, Number(g.currentAmount||0) - Number(entry.goalSyncAmt||0));
  entry.goalSyncId = null; entry.goalSyncAmt = 0;
}
function syncEntryToGoal(entry){
  if(!entry || entry.linkedGoalId) return null;
  unsyncEntryGoal(entry);
  if(entry.category !== 'Emergency Fund') return null;
  const g = state.data.goals.find(x=>/emergency/i.test(x.name||''));
  if(!g) return null;
  const amt = Number(entry.amount||0);
  const wasComplete = g.targetAmount>0 && Number(g.currentAmount||0) >= g.targetAmount;
  g.currentAmount = Number(g.currentAmount||0) + amt;
  entry.goalSyncId = g.id; entry.goalSyncAmt = amt;
  return { goal:g, done: g.targetAmount>0 && g.currentAmount>=g.targetAmount && !wasComplete };
}
/* When an "emergency" goal is created/edited, pull in Emergency Fund savings entries logged earlier */
function absorbEmergencyEntries(g){
  if(!g || !/emergency/i.test(g.name||'')) return 0;
  let n = 0;
  state.data.savings.forEach(e=>{
    const stale = e.goalSyncId && !state.data.goals.find(x=>x.id===e.goalSyncId);
    if(e.category==='Emergency Fund' && !e.linkedGoalId && (!e.goalSyncId || stale)){
      const amt = Number(e.amount||0);
      g.currentAmount = Number(g.currentAmount||0) + amt;
      e.goalSyncId = g.id; e.goalSyncAmt = amt; n++;
    }
  });
  return n;
}
/* Repairs data logged before the links existed (or while they were broken):
   Health spending -> Protection, Emergency Fund savings -> "Emergency" goal. */
function reconcileLinks(){
  const d = state.data; let changed = false;
  d.spending.transactions.slice().forEach(tx=>{
    if(tx.goalId || tx.unlinked || !SPENDING_LINKS[tx.category]) return;
    const pl = tx.linkedPillar || 'protection';
    const has = tx.linkedId && (d[pl]||[]).some(p=>p.id===tx.linkedId);
    if(!has){ tx.linkedId = null; syncSpendingLink(tx); changed = true; }
  });
  d.goals.forEach(g=>{ if(absorbEmergencyEntries(g)) changed = true; });
  return changed;
}
function announceGoalSync(gs){
  if(!gs) return;
  showToast('🔗 Also added to goal → '+gs.goal.name);
  if(gs.done) celebrateGoal(gs.goal.name);
}
/* Keeps a Protection / Savings entry mirrored to a spending transaction. Returns {pillar, category} if reflected. */
/* Cross-pillar reflection is virtual: the source transaction is stored once.
   The related pillar only renders a linked view of that source record. */
function syncSpendingLink(tx){
  if(!tx) return null;
  const rule = SPENDING_LINKS[tx.category];
  tx.linkedPillar = rule ? rule.pillar : null;
  tx.linkedCategory = rule ? rule.category : null;
  tx.linkedId = null;
  return rule ? Object.assign({}, rule, { sourceId:tx.id }) : null;
}
function removeSpendingLink(tx){
  if(tx){ tx.linkedId=null; tx.linkedPillar=null; tx.linkedCategory=null; }
}

/* Convert old mirrored records to the single-source model. */
function migrateToSingleSource(){
  const d = state.data; let changed = false;
  const legacySavingsCats = ["Emergency Fund","Short-Term Goal","Retirement Savings","Sinking Fund","Other Savings"];

  // Remove old mirror rows from pillar data. They are now generated from the source record.
  ['savings','investment','protection'].forEach(p=>{
    d[p] = (d[p]||[]).filter(e=>{
      if(e.linkedTxId){ changed=true; return false; }
      return true;
    });
  });

  // Older versions allowed Savings categories inside Spending. Move those records to Savings.
  // Older Health spending is retained as Spending, but is now classified as Other Expense.
  const oldTx = d.spending.transactions || [];
  const migratedTx = [];
  oldTx.forEach(tx=>{
    if(legacySavingsCats.includes(tx.category)){
      const exists = d.savings.some(e=>e.id===tx.id || (e.date===tx.date && e.amount===tx.amount && e.description===tx.description && e.category===tx.category));
      if(!exists){
        d.savings.push(Object.assign({}, tx, { linkedTxId:null, linkedId:null, linkedPillar:null, linkedCategory:null }));
      }
      changed=true;
      return;
    }
    if(tx.category==='Health'){
      tx.category='Other Expense';
      tx.linkedId=null; tx.linkedPillar=null; tx.linkedCategory=null;
      changed=true;
    }
    migratedTx.push(tx);
  });
  d.spending.transactions = migratedTx;

  // Convert legacy goal contributions that were stored as Spending transactions.
  d.spending.transactions.slice().forEach(tx=>{
    if(tx.goalId){
      const g=d.goals.find(x=>x.id===tx.goalId);
      if(g){
        g.contributions = Array.isArray(g.contributions)?g.contributions:[];
        const c = { id:tx.id, date:tx.date, amount:Number(tx.amount||0), description:tx.description||('Goal: '+g.name), sourceId:tx.id };
        if(!g.contributions.some(existing=>existing.id===c.id || existing.sourceId===c.sourceId)){
          g.contributions.push(c);
        }
      }
      d.spending.transactions = d.spending.transactions.filter(x=>x.id!==tx.id);
      changed=true;
    }
  });

  // Rebuild goal reflections into Savings / Investment / Protection only.
  const beforeCounts = ['savings','investment','protection'].map(k=>(d[k]||[]).length).join(',');
  syncAllGoalContributions();
  const afterCounts = ['savings','investment','protection'].map(k=>(d[k]||[]).length).join(',');
  if(beforeCounts!==afterCounts) changed=true;

  // Spending has no automatic cross-pillar links anymore.
  d.spending.transactions.forEach(tx=>{
    if(tx.linkedPillar || tx.linkedCategory || tx.linkedId){
      tx.linkedId=null; tx.linkedPillar=null; tx.linkedCategory=null;
      changed=true;
    }
  });

  if(changed) saveData();
  return changed;
}

/* =========================================================
   RECEIPT PHOTO CAPTURE (resized client-side, no upload)
   ========================================================= */
let pendingMood = null;
let pendingReceipt = null;
function readAndCompressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || file.type.indexOf('image/')!==0){ reject(new Error('not an image')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
          else { width = Math.round(width * maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function renderReceiptPreview(){
  const box = document.getElementById('receiptPreview');
  if(!box) return;
  box.innerHTML = pendingReceipt
    ? `<img src="${pendingReceipt}" alt="Receipt preview" data-action="preview-receipt"><button type="button" class="receipt-remove" data-action="remove-receipt" aria-label="Remove receipt">${ICONS.trash}</button>`

/* =========================================================
   VOICE ENTRY (Web Speech API — fills the description field)
   ========================================================= */
function startVoiceInput(button){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert("Voice input isn't supported in this browser. Try Chrome on desktop or Android."); return; }
  const form = button.closest('form');
  const input = form ? form.querySelector('[name="description"]') : null;
  const recog = new SR();
  recog.lang = 'en-PH';
  recog.interimResults = false;
  recog.maxAlternatives = 1;
  const original = button.innerHTML;
  button.innerHTML = '🎙️ Listening…';
  button.disabled = true;
  recog.onresult = (ev) => {
    const text = ev.results && ev.results[0] && ev.results[0][0] ? ev.results[0][0].transcript : '';
    if(input && text) input.value = text;
  };
  recog.onerror = () => {};
  recog.onend = () => { button.innerHTML = original; button.disabled = false; };
  try{ recog.start(); } catch(err){ button.innerHTML = original; button.disabled = false; }
}

/* ---------- computations ---------- */
function withPctChange(entries){
  const sorted = [...entries].sort((a,b)=> (a.date||'').localeCompare(b.date||'') || a.id.localeCompare(b.id));
  let prev = null;
  return sorted.map(e=>{
    let p = null;
    if(prev!==null && prev!==0) p = (e.amount-prev)/prev;
    prev = e.amount;
    return Object.assign({}, e, {pctChange:p});
  });
}
function pillarTotal(entries, year){
  return entries.filter(e=> year==='all' || (e.date||'').slice(0,4)===year).reduce((s,e)=>s+Number(e.amount||0),0);
}
function categoryBreakdown(entries, year){
  const map = {};
  entries.filter(e=> year==='all' || (e.date||'').slice(0,4)===year).forEach(e=>{
    map[e.category] = (map[e.category]||0) + Number(e.amount||0);
  });
  return map;
}
function allYears(data){
  const set = new Set();
  ['income','savings','investment','protection'].forEach(k=> data[k].forEach(e=> e.date && set.add(e.date.slice(0,4))));
  data.spending.transactions.forEach(e=> e.date && set.add(e.date.slice(0,4)));
  data.goals.forEach(g=> g.targetDate && set.add(g.targetDate.slice(0,4)));
  return Array.from(set).sort();
}
/* Goal-linked pillar entries are reflections of Goal contributions, so net cash flow must skip the pillar copy. */
const isMirrored = e => !!(e.linkedTxId || e.linkedGoalId);
const unmirrored = arr => arr.filter(e=>!isMirrored(e));
function computeDashboard(data, year){
  const inc  = pillarTotal(data.income, year);
  const sav  = pillarTotal(data.savings, year);
  const inv  = pillarTotal(data.investment, year);
  const prot = pillarTotal(data.protection, year);
  const spend = pillarTotal(data.spending.transactions, year);
  const net = inc - spend - pillarTotal(unmirrored(data.savings),year) - pillarTotal(unmirrored(data.investment),year) - pillarTotal(unmirrored(data.protection),year);
  const rate = inc>0 ? (sav+inv)/inc : 0;
  const goals = data.goals;
  const goalCurSum = goals.reduce((s,g)=>s+Number(g.currentAmount||0),0);
  const goalTargetSum = goals.reduce((s,g)=>s+Number(g.targetAmount||0),0);
  const avgProgress = goalTargetSum>0 ? goalCurSum/goalTargetSum : 0;
  return { inc, sav, inv, prot, spend, net, rate, avgProgress };
}
function goalStatus(g){
  const progress = g.targetAmount>0 ? g.currentAmount/g.targetAmount : 0;
  if(progress>=1) return 'Complete';
  if(g.targetDate && g.targetDate < todayISO()) return 'Past Due';
  return 'In Progress';
}
function statusBadgeClass(s){ return s==='Complete'?'b-good':(s==='Past Due'?'b-bad':'b-warn'); }

function pillarInsights(entries){
  const count = entries.length;
  const total = entries.reduce((s,e)=>s+Number(e.amount||0),0);
  const avg = count ? total/count : 0;
  const catMap = {};
  entries.forEach(e=>{ catMap[e.category] = (catMap[e.category]||0) + Number(e.amount||0); });
  let topCat = '—', topVal = 0;
  Object.entries(catMap).forEach(([c,v])=>{ if(v>topVal){ topVal=v; topCat=c; } });
  return { count, total, avg, topCat, topVal };
}
const MONTH_LABELS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthSum(entries, year, month){
  const mm = String(month).padStart(2,'0');
  return entries.filter(e=> e.date && e.date.slice(0,4)===year && e.date.slice(5,7)===mm).reduce((s,e)=>s+Number(e.amount||0),0);
}
function periodBuckets(entries, year){
  if(year && year!=='all'){
    const values = MONTH_LABELS.map((_,i)=> monthSum(entries, year, i+1));
    return { labels: MONTH_LABELS, values };
  }
  const years = Array.from(new Set(entries.map(e=>(e.date||'').slice(0,4)).filter(Boolean))).sort();
  const values = years.map(y=> pillarTotal(entries, y));
  return { labels: years.length?years:['—'], values: years.length?values:[0] };
}
function dashboardTrend(data, year){
  const labels = (year && year!=='all') ? MONTH_LABELS : allYears(data);
  if(!labels.length) return { labels:['—'], inc:[0], spend:[0], net:[0], sav:[0], inv:[0], prot:[0] };
  const at = (entries,i)=> (year && year!=='all') ? monthSum(entries, year, i+1) : pillarTotal(entries, labels[i]);
  const tx = data.spending.transactions;
  const inc  = labels.map((_,i)=> at(data.income,i));
  const spend= labels.map((_,i)=> at(tx,i));
  const sav  = labels.map((_,i)=> at(data.savings,i));
  const inv  = labels.map((_,i)=> at(data.investment,i));
  const prot = labels.map((_,i)=> at(data.protection,i));
  const net  = labels.map((_,i)=> inc[i] - spend[i] - at(unmirrored(data.savings),i) - at(unmirrored(data.investment),i) - at(unmirrored(data.protection),i));
  return { labels, inc, spend, net, sav, inv, prot };
}
function goalColorVar(g){
  const map = { Savings:'sage', Investment:'lavender', Protection:'gold', 'Debt Payoff':'danger', Other:'ink' };
  return 'var(--' + (map[g.category] || 'lavender') + ')';
}
function monthLabel(mk){
  const [y,m] = mk.split('-');
  const d = new Date(Number(y), Number(m)-1, 1);
  return d.toLocaleDateString('en-US',{month:'short', year:'2-digit'});
}
function monthlyBreakdown(entries, year){
  const filtered = entries.filter(e=> year==='all' || (e.date||'').slice(0,4)===year);
  const map = {};
  filtered.forEach(e=>{ const mk=(e.date||'').slice(0,7); if(!mk) return; map[mk]=(map[mk]||0)+Number(e.amount||0); });
  const keys = Object.keys(map).sort();
  return { keys, labels: keys.map(monthLabel), values: keys.map(k=>map[k]) };
}
function monthlySeries(data, year){
  const all = {};
  const add = (entries, bucket) => entries.filter(e=> year==='all' || (e.date||'').slice(0,4)===year)
    .forEach(e=>{ const mk=(e.date||'').slice(0,7); if(!mk) return; all[mk]=all[mk]||{income:0,outflow:0}; all[mk][bucket]+=Number(e.amount||0); });
  add(data.income,'income');
  add(data.spending.transactions,'outflow');
  add(unmirrored(data.savings),'outflow');
  add(unmirrored(data.investment),'outflow');
  add(unmirrored(data.protection),'outflow');
  const keys = Object.keys(all).sort();
  return { labels: keys.map(monthLabel), income: keys.map(k=>all[k].income), outflow: keys.map(k=>all[k].outflow) };
}

function appShellChrome(title, desc, subroute, showYearFilter){

}
function todayLongDate(){
  return new Date().toLocaleDateString('en-PH', { weekday:'long', month:'long', day:'numeric' });
}

function yearSelectHTML(){
  const years = allYears(state.data);
  return `<select class="year-select" data-action="year-filter">
    <option value="all" ${state.yearFilter==='all'?'selected':''}>All years</option>
    ${years.map(y=>`<option value="${y}" ${state.yearFilter===y?'selected':''}>${y}</option>`).join('')}
  </select>`;
}

function renderApp(route){
  const sub = (route || 'dashboard').replace(/^\//,'');
  const titles = { dashboard:'Dashboard', income:'Income', savings:'Savings', spending:'Spending', investment:'Investment', protection:'Protection', goals:'Goals', settings:'Settings' };
  const yearFilterPages = ['dashboard','income','savings','spending','investment','protection'];
  root().innerHTML = appShellChrome(titles[sub]||'Dashboard', '', sub, yearFilterPages.includes(sub));
  const body = document.getElementById('view-body');
  if(sub==='dashboard') body.innerHTML = viewDashboard();
  else if(sub==='spending') body.innerHTML = viewSpending();
  else if(sub==='goals') body.innerHTML = viewGoals();
  else if(sub==='settings') body.innerHTML = viewSettings();
  else if(pillarByKey(sub)) body.innerHTML = viewPillar(sub);
  else body.innerHTML = viewDashboard();

  if(sub==='dashboard') mountDashboardCharts();
  else if(sub==='spending') mountSpendingChart();
  else if(pillarByKey(sub) && sub!=='spending') mountPillarChart(sub);
}

/* =========================================================
   DASHBOARD
   ========================================================= */
function greeting(){
  const h = new Date().getHours();
  if(h<12) return 'Good morning';
  if(h<18) return 'Good afternoon';
  return 'Good evening';
}
function cardHead(icon, title, colorVar, tintVar){
  return `<div class="card-head"><span class="ci" style="background:${tintVar};color:${colorVar};">${icon}</span><h3>${title}</h3></div>`;
}

function headline(k, totalsEmpty){
  if(totalsEmpty) return "Let's map your money.";
  if(k.net > 0) return `You're ${money(k.net)} ahead so far.`;
  if(k.net < 0) return `You're ${money(Math.abs(k.net))} in the red so far.`;
  return "Right at breakeven.";
}

    <div class="card">
      ${cardHead(ICONS.dashboard, 'Pillar totals', 'var(--ink)', 'var(--cream-2)')}

    </div>
    <div class="card">
      ${cardHead(ICONS.income, 'Income by category', 'var(--rose-ink)', 'var(--rose-tint)')}

    </div>

  <div class="grid-2">
    <div class="card">
      ${cardHead(ICONS.spending, 'Spending by category', 'var(--peach-ink)', 'var(--peach-tint)')}
      <div class="chart-box"><canvas id="chart-spend-cat"></canvas></div>
    </div>
    <div class="card">
      ${cardHead(ICONS.goals, 'Goal progress', 'var(--lavender-ink)', 'var(--lavender-tint)')}
      ${d.goals.length ? d.goals.slice(0,5).map(g=>{
          const progress = g.targetAmount>0 ? Math.min(1,g.currentAmount/g.targetAmount) : 0;
          const status = goalStatus(g);

function chartNav(routeFor){
  return {
    onClick:(evt, els, chart)=>{ if(!els.length) return; const r = routeFor(els[0], chart); if(r) navigate('#/'+r); },
    onHover:(evt, els, chart)=>{
      const r = els.length ? routeFor(els[0], chart) : null;
      if(evt.native && evt.native.target) evt.native.target.style.cursor = r ? 'pointer' : 'default';
    }
  };
}

function pieConfig(map, paletteVars, route){
  const labels = Object.keys(map);
  const values = Object.values(map);
  const colors = labels.map((_,i)=>cssVar(paletteVars[i % paletteVars.length]));
  if(!labels.length){
    return { type:'doughnut', data:{labels:['No data'],datasets:[{data:[1],backgroundColor:[cssVar('--border')]}]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:{enabled:false}} } };
  }
  return {
    type:'doughnut',
    data:{ labels, datasets:[{ data:values, backgroundColor:colors, borderColor:cssVar('--surface'), borderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
      ...(route ? chartNav((el,chart)=> typeof route==='function' ? route(el,chart) : route) : {}),
      plugins:{ legend:{position:'bottom', labels:{boxWidth:11,padding:12,font:{size:11.5}}}, tooltip:{callbacks:{label:c=>c.label+': '+money(c.parsed)}} } }
  };
}

/* =========================================================
   SPENDING (budget vs actual + transaction log)
   ========================================================= */
function viewSpending(){
  const d = state.data;
  const cats = CATS.spending;
  const tx = d.spending.transactions.filter(e=> state.yearFilter==='all' || (e.date||'').slice(0,4)===state.yearFilter);
  const actualByCat = categoryBreakdown(tx, 'all');
  let totalBudget=0, totalActual=0;
  const rows = cats.map(c=>{
    const budget = Number(d.spending.budgets[c]||0);
    const actual = Number(actualByCat[c]||0);
    const variance = budget - actual;
    const usedPct = budget>0 ? actual/budget : null;
    totalBudget += budget; totalActual += actual;
    return {c,budget,actual,variance,usedPct};
  });
  const entries = withPctChange(tx);
  const insights = pillarInsights(tx);
  const ed = state.editing;
  const editingTx = (ed && ed.scope==='tx') ? d.spending.transactions.find(e=>e.id===ed.id) : null;
  const moodMap = moodBreakdown(tx);
  const moodRanked = MOODS.filter(m=>moodMap[m.key]).sort((a,b)=> moodMap[b.key].total - moodMap[a.key].total);
  const streakDays = mindfulStreakDays(d.spending.transactions);
  const negStats = negativeMoodThisMonth(d.spending.transactions);

  // reset transient form state to match whatever we're editing (or a blank add-form)
  pendingMood = editingTx ? (editingTx.mood || null) : null;
  pendingReceipt = editingTx ? (editingTx.receipt || null) : null;

  return `
  <div class="view-head">
    <div>
      <h1><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--peach);margin-right:9px;"></span>Spending</h1>
      <p class="desc">Set a monthly budget per category, then log transactions — variance and percent used update automatically. Tag the mood behind each purchase and attach a receipt if you like. Goals are reflected only in Savings, Investment, or Protection.</p>
    </div>
  </div>

  <div class="stat-chips">
    <div class="stat-chip"><div class="sc-label">Spent ${state.yearFilter!=='all'?'('+state.yearFilter+')':''}</div><div class="sc-value">${money(insights.total)}</div></div>
    <div class="stat-chip"><div class="sc-label">Transactions</div><div class="sc-value">${insights.count}</div></div>
    <div class="stat-chip"><div class="sc-label">Average per transaction</div><div class="sc-value">${money(insights.avg)}</div></div>
    <div class="stat-chip"><div class="sc-label">Biggest category</div><div class="sc-value" style="font-size:15.5px;">${esc(insights.topCat)}</div></div>
    <div class="stat-chip"><div class="sc-label">🔥 Mindful streak</div><div class="sc-value" style="font-size:15.5px;">${streakDays==null ? 'No slips yet' : (streakDays===0 ? 'Reset today' : streakDays+' day'+(streakDays===1?'':'s'))}</div></div>
  </div>

  ${negStats.count>=2 ? `
  <div class="nudge-banner">
    <span class="nudge-emoji">💛</span>
    <div class="nudge-text"><strong>Gentle nudge:</strong> ${negStats.count} purchases logged as stressed or guilty this month, totaling ${money(negStats.total)}. Might be worth a pause before the next one.</div>
    <button type="button" class="nudge-close" onclick="this.closest('.nudge-banner').remove()" aria-label="Dismiss">${ICONS.close}</button>
  </div>` : ''}

  <div class="card" style="margin-bottom:20px;">
    <h3>Budget vs. actual by category</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Category</th><th class="num">Monthly Budget</th><th class="num">Actual Spent</th><th class="num">Variance</th><th class="num">% of Budget Used</th></tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td>${r.c}</td>
              <td class="num"><input class="budget-input num" type="number" min="0" step="0.01" data-action="set-budget" data-cat="${r.c}" value="${r.budget||''}" placeholder="0.00"></td>

    <form data-form="goal">
      <input type="hidden" name="editId" value="${editingGoal?editingGoal.id:''}">

        <div class="field"><label>Target amount</label><input type="number" name="targetAmount" min="0" step="0.01" required value="${editingGoal?editingGoal.targetAmount:''}" placeholder="0.00"></div>

  ${goals.length ? goals.map(g=>{

/* =========================================================
   EVENT HANDLING (delegated)
   ========================================================= */
function bindDelegatedEvents(){
  const r = root();
  r.addEventListener('submit', onSubmit);
  r.addEventListener('click', onClick);
  r.addEventListener('change', onChange);
  r.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('[data-action="go"]')){ e.preventDefault(); navigate('#'+e.target.dataset.route); } });
}

function onSubmit(e){
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const type = form.dataset.form;

  if(type==='profile'){
    const name = form.name.value.trim();
    if(!name){ return; }
    const orgName = form.orgName.value.trim();
    const users = getUsers();
    if(users[state.user.email]){
      users[state.user.email].name = name;
      users[state.user.email].orgName = orgName;
      saveUsers(users);
    }
    state.user.name = name;
    state.user.orgName = orgName;
    rerenderCurrent();
    const saved = document.querySelector('[data-saved]');
    if(saved){ saved.style.display='block'; setTimeout(()=>{ if(saved) saved.style.display='none'; }, 2200); }
    return;
  }

  if(type==='entry'){
    const pillar = form.dataset.pillar;
    const amount = parseFloat(form.amount.value);
    if(!(amount>=0)) return;
    const editId = form.editId.value;
    let rec = null;
    if(editId){
      rec = state.data[pillar].find(x=>x.id===editId);
      if(rec){ rec.date=form.date.value; rec.category=form.category.value; rec.description=form.description.value.trim(); rec.amount=amount; }
    } else {
      rec = { id:uid(), date:form.date.value, category:form.category.value, description:form.description.value.trim(), amount };
      state.data[pillar].push(rec);
    }
    const gs = (pillar==='savings' && rec) ? syncEntryToGoal(rec) : null;
    state.editing = null;
    saveData(); rerenderCurrent();
    announceGoalSync(gs);
    return;
  }
  if(type==='spendingTx'){
    const amount = parseFloat(form.amount.value);
    if(!(amount>=0)) return;
    const editId = form.editId.value;
    const mood = pendingMood || null;
    const receipt = pendingReceipt || null;
    let savedTx = null;
    if(editId){
      const rec = state.data.spending.transactions.find(x=>x.id===editId);
      if(rec){ rec.date=form.date.value; rec.category=form.category.value; rec.description=form.description.value.trim(); rec.amount=amount; rec.mood=mood; rec.receipt=receipt; savedTx = rec; }
    } else {
      savedTx = { id:uid(), date:form.date.value, category:form.category.value, description:form.description.value.trim(), amount, mood, receipt, linkedId:null, linkedPillar:null };
      state.data.spending.transactions.push(savedTx);
    }
    const reflected = savedTx ? syncSpendingLink(savedTx) : null;
    pendingMood = null; pendingReceipt = null;
    state.editing = null;
    saveData(); rerenderCurrent();
    if(reflected) showToast('🔗 Also reflected in '+(reflected.pillar==='savings'?'Savings':'Protection')+' → '+reflected.category);
    if(reflected && reflected.goalSync) announceGoalSync(reflected.goalSync);
    return;
  }
  if(type==='goal'){
    const targetAmount = parseFloat(form.targetAmount.value);
    if(!(targetAmount>=0)) return;
    const editId = form.editId.value;
    const newCurrent = parseFloat(form.currentAmount.value)||0;
    if(editId){
      const rec = state.data.goals.find(x=>x.id===editId);
      if(rec){
        const wasComplete = targetAmount>0 && Number(rec.currentAmount||0) >= rec.targetAmount;
        const oldCurrent = Number(rec.currentAmount||0);
        rec.name=form.name.value.trim(); rec.category=form.category.value; rec.targetAmount=targetAmount; rec.targetDate=form.targetDate.value;
        rec.contributions = Array.isArray(rec.contributions) ? rec.contributions : [];
        if(newCurrent > oldCurrent){
          const contribution = { id:uid(), date:todayISO(), amount:newCurrent-oldCurrent, description:'Goal: '+rec.name };
          rec.contributions.push(contribution);
          syncGoalContributionToPillar(rec, contribution);
        }
        rec.currentAmount=newCurrent;
        const nowComplete = targetAmount>0 && newCurrent >= targetAmount;
        if(rec.targetAmount>0 && Number(rec.currentAmount||0) >= rec.targetAmount && !wasComplete) celebrateGoal(rec.name);
      }
    } else {
      const name = form.name.value.trim();
      const ng = { id:uid(), name, category:form.category.value, targetAmount, targetDate:form.targetDate.value, currentAmount: 0, contributions:[] };
      state.data.goals.push(ng);
      if(newCurrent>0){
        const contribution = { id:uid(), date:todayISO(), amount:newCurrent, description:'Goal: '+ng.name };
        ng.contributions.push(contribution);
        syncGoalContributionToPillar(ng, contribution);
        ng.currentAmount = newCurrent;
      }
      if(targetAmount>0 && ng.currentAmount >= targetAmount) celebrateGoal(name);
    }
    state.editing = null;
    saveData(); rerenderCurrent();
    return;
  }
  if(type==='contribute'){
    const id = form.dataset.id;
    const add = parseFloat(form.amount.value);
    if(!(add>0)) return;
    const g = state.data.goals.find(g=>g.id===id);
    if(g){
      const wasComplete = g.targetAmount>0 && Number(g.currentAmount||0) >= g.targetAmount;
      g.currentAmount = Number(g.currentAmount||0) + add;
      const nowComplete = g.targetAmount>0 && g.currentAmount >= g.targetAmount;
      g.contributions = Array.isArray(g.contributions) ? g.contributions : [];
      const contribution = { id:uid(), date:todayISO(), amount:add, description:'Goal: '+g.name };
      g.contributions.push(contribution);
      const rule = GOAL_TO_PILLAR[g.category] || null;
      if(rule) syncGoalContributionToPillar(g, contribution);
      saveData(); rerenderCurrent();
      showToast(rule ? '🔗 Contribution reflected in '+(rule.pillar==='savings'?'Savings':rule.pillar==='investment'?'Investment':'Protection')+' → '+rule.category : '🔗 Goal contribution saved');
      if(nowComplete && !wasComplete) celebrateGoal(g.name);
      return;
    }
    saveData(); rerenderCurrent();
    return;
  }
}

function onClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='logout'){
    if(!confirm('Log out of Money Map?')) return;
    clearSession(); state.user=null; state.data=null; window.location.href='landing.html'; return;
  }
  if(action==='set-theme'){
    const value = el.dataset.value === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', value);
    localStorage.setItem(LS_THEME, value);
    rerenderCurrent();
    return;
  }
  if(action==='open-sidebar'){ document.getElementById('sidebar').classList.add('open'); document.querySelector('.scrim').classList.add('show'); return; }
  if(action==='close-sidebar'){ document.getElementById('sidebar').classList.remove('open'); document.querySelector('.scrim').classList.remove('show'); return; }
  if(action==='go'){ navigate('#'+el.dataset.route); return; }
  if(action==='cancel-edit'){ state.editing = null; rerenderCurrent(); return; }
  if(action==='edit-entry'){
    state.editing = { scope:'entry', pillar:el.dataset.pillar, id:el.dataset.id };
    rerenderCurrent(); return;
  }
  if(action==='edit-tx'){
    state.editing = { scope:'tx', id:el.dataset.id };
    rerenderCurrent(); return;
  }
  if(action==='edit-goal'){
    state.editing = { scope:'goal', id:el.dataset.id };
    rerenderCurrent(); return;
  }
  if(action==='delete-entry'){
    const pillar = el.dataset.pillar, id = el.dataset.id;
    // deleting an auto-added Protection/Savings entry just unlinks it from its spending transaction
    unsyncEntryGoal(state.data[pillar].find(x=>x.id===id));
    state.data.spending.transactions.filter(t=>t.linkedId===id && t.goalId).forEach(t=>{
      const g = state.data.goals.find(x=>x.id===t.goalId);
      if(g) g.currentAmount = Math.max(0, Number(g.currentAmount||0) - Number(t.amount||0));
    });
    state.data.spending.transactions = state.data.spending.transactions.filter(t=>!(t.linkedId===id && t.goalId));
    state.data.spending.transactions.forEach(t=>{ if(t.linkedId===id){ t.linkedId = null; t.linkedPillar = null; t.unlinked = true; } });
    state.data[pillar] = state.data[pillar].filter(x=>x.id!==id);
    if(state.editing && state.editing.scope==='entry' && state.editing.id===id) state.editing=null;
    saveData(); rerenderCurrent(); return;
  }
  if(action==='delete-tx'){
    const id = el.dataset.id;
    const delTx = state.data.spending.transactions.find(x=>x.id===id);
    removeSpendingLink(delTx);
    if(delTx && delTx.goalId){
      const g = state.data.goals.find(x=>x.id===delTx.goalId);
      if(g) g.currentAmount = Math.max(0, Number(g.currentAmount||0) - Number(delTx.amount||0));
    }
    state.data.spending.transactions = state.data.spending.transactions.filter(x=>x.id!==id);
    if(state.editing && state.editing.scope==='tx' && state.editing.id===id) state.editing=null;
    saveData(); rerenderCurrent(); return;
  }
  if(action==='delete-goal'){
    const id = el.dataset.id;
    state.data.goals = state.data.goals.filter(x=>x.id!==id);
    if(state.editing && state.editing.scope==='goal' && state.editing.id===id) state.editing=null;
    saveData(); rerenderCurrent(); return;
  }
  if(action==='clear-data'){
    if(confirm('Clear all entries, budgets, and goals? This cannot be undone.')){
      state.data = defaultData(); state.editing = null; saveData(); rerenderCurrent();
    }
    return;
  }
  if(action==='pick-mood'){
    setMoodActive(el.dataset.mood);
    return;
  }
  if(action==='voice-desc'){
    startVoiceInput(el);
    return;
  }
  if(action==='remove-receipt'){
    pendingReceipt = null;
    renderReceiptPreview();
    return;
  }
  if(action==='preview-receipt'){
    openReceiptLightbox(pendingReceipt);
    return;
  }
  if(action==='view-receipt'){
    const tx = state.data.spending.transactions.find(x=>x.id===el.dataset.id);
    if(tx) openReceiptLightbox(tx.receipt);
    return;
  }
}

function onChange(e){
  const el = e.target;
  if(el.dataset.action==='set-budget'){
    const cat = el.dataset.cat;
    const val = parseFloat(el.value);
    state.data.spending.budgets[cat] = isNaN(val) ? 0 : val;
    saveData(); rerenderCurrent(); return;
  }
  if(el.dataset.action==='year-filter'){
    state.yearFilter = el.value;
    rerenderCurrent(); return;
  }
  if(el.dataset.action==='receipt-file'){
    const file = el.files && el.files[0];
    if(!file) return;
    readAndCompressImage(file, 480, 0.6).then(dataUrl=>{
      pendingReceipt = dataUrl;
      renderReceiptPreview();
    }).catch(()=>{
      alert("Couldn't read that photo — please try a different image file.");
    });
    return;
  }
}

function rerenderCurrent(){ renderApp(currentRoute()); }

</script>
</body>
</html>
